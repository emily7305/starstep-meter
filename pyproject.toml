[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "starstep_meter"
version = "0.1.0"
description = "Beat, tempo, and meter analysis for rhythm game charting"
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn>=0.30",
    "numpy>=1.26",
    "soundfile>=0.12",
    "librosa>=0.10.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# the pypi release (0.16.1) doesn't build or import on current python/numpy,
# so this pins the git commit that was tested, see docs/decisions.md
madmom = [
    "madmom @ git+https://github.com/CPJKU/madmom@27f032e8947204902c675e5e341a3faf5dc86dae",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    # librosa already pulls it in, listed because the decode tests cross-correlate with it
    "scipy>=1.10",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
